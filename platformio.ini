; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = 
	disco_b_g431b_esc1
test_dir = lib/SimpleCAN/test

[env]
framework = arduino
lib_archive = false
monitor_eol = LF
lib_deps = 
	askuric/Simple FOC@^2.4.0
	simplefoc/SimpleFOCDrivers@^1.0.9

; TODO: -fpermissive throws warnings when applied as a global build flag
; use pio example for splitting C++ and C flags
; https://docs.platformio.org/en/latest/scripting/examples/split_build_flags.html

[env:disco_b_g431b_esc1]
platform = ststm32@^18.0.0
board = disco_b_g431b_esc1
test_ignore = test_desktop
monitor_speed = 230400
build_unflags = -Os
build_flags = 
	-O3
	-fpermissive
	-D PREFETCH=1U
	-D HAL_CORDIC_MODULE_ENABLED
	-D PIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_PRINTF
	; -D HAL_FDCAN_MODULE_ENABLED ; Now enabled by default in stm32duino for this board
	-D HAL_OPAMP_MODULE_ENABLED
	-D SIMPLEFOC_STM32_DEBUG
	; -D CAN_DEBUG
	-D SERIAL_TX_BUFFER_SIZE=256
	-D PIN_CAN0_RX=PA_11
	-D PIN_CAN0_TX=PB_9
	-D CAN_SHDN=PB_4
	-D CAN_HOWMANY=1


