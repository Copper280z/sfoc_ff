[env:stm32f405rg_vesc]
platform = ststm32@^18.0.0
board = genericSTM32F405RG
framework = arduino
monitor_speed = 230400
upload_protocol = stlink
debug_tool = stlink
build_flags = 
	-D HSE_VALUE=8000000
	-D USBCON
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	-D USBD_USE_CDC
	-D HAL_CAN_MODULE_ENABLED
	-D CAN_DEBUG
	-D PIN_CAN0_RX=PB_8
	-D PIN_CAN0_TX=PB_9
	-D CAN_HOWMANY=1


